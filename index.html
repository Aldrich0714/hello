<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Pink Tulip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="garden">
        <div class="tulip-grand">
            <div class="blossom-box">
                <div class="petal-back left-back"></div>
                <div class="petal-back right-back"></div>
                
                <div class="pistil"></div>
                
                <div class="petal-main left-front"></div>
                <div class="petal-main right-front"></div>
                <div class="petal-main center-front"></div>
            </div>

            <div class="stem"></div>
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
